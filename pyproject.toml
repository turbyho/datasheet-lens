[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasheet-lens"
version = "0.2.0"
description = "Index of component datasheets, and pages of the original on demand, for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Turbyho" }]
keywords = ["datasheet", "pdf", "mcp", "llm", "electronics", "kicad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pypdfium2>=5.14",
    "mcp>=2.3",
    # Writes the project file and keeps the comments and the keys of the user.
    "tomlkit>=0.15",
    # The API keys of the distributors in the key store of the system.
    "keyring>=25.6",
    # The comparison of versions for the update check (version_check.py).
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/turbyho/datasheet-lens"
Source = "https://github.com/turbyho/datasheet-lens"
Documentation = "https://github.com/turbyho/datasheet-lens/tree/main/doc"
Issues = "https://github.com/turbyho/datasheet-lens/issues"

[project.optional-dependencies]
# Element map with the docling layout model (torch, some GB of disk).
layout = ["docling>=2.144"]
dev = ["pytest>=8"]

[project.scripts]
datasheet-lens = "datasheet_lens.cli:main"
datasheet-lens-mcp = "datasheet_lens.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheet_lens"]

# Only the public files: the work folders (plans/, spike/ with third-party PDF
# files) are in the working tree, but never in a distribution.
[tool.hatch.build.targets.sdist]
include = ["src/datasheet_lens", "tests", "doc", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
