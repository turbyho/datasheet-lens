name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest and the newest Python version of pyproject.toml.
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The server extra lets the tests of the team server load. They skip
      # with no test database and no object store (DSLENS_TEST_PG).
      - name: Install the package with the server and dev extras
        run: python -m pip install -e ".[server,dev]"
      - name: Run the tests
        run: python -m pytest -q -rfE
